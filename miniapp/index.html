<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Memos</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <section id="list-screen">
      <header class="header">
        <div class="header-title">
          <h1>Memos</h1>
          <div class="header-actions">
            <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh memos" title="Refresh memos">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/>
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/>
              </svg>
            </button>
            <button id="settings-button" class="icon-button" type="button" aria-label="Manage categories" title="Manage categories">
              <svg class="filled-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill-rule="evenodd" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.95l-.36-2.51a.49.49 0 0 0-.49-.42h-3.84a.49.49 0 0 0-.49.42L9.2 5.31c-.59.23-1.13.54-1.63.95l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64L4.8 11.06c-.05.3-.08.62-.08.94s.03.64.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.38.3.61.22l2.39-.96c.5.4 1.04.72 1.63.95l.36 2.51c.04.24.24.42.49.42h3.84c.25 0 .45-.18.49-.42l.36-2.51c.59-.23 1.13-.55 1.63-.95l2.39.96c.23.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="tabs" role="tablist" aria-label="View">
          <button id="date-tab" class="tab active" type="button" role="tab" aria-selected="true">By Date</button>
          <button id="tags-tab" class="tab" type="button" role="tab" aria-selected="false">By Categories</button>
        </div>
      </header>
      <div id="list-status" class="status" role="status"></div>
      <div id="groups"></div>
    </section>
    <section id="settings-screen" hidden>
      <button id="settings-back-button" class="back-button" type="button">← Back</button>
      <div class="settings-heading">
        <h1>Categories</h1>
        <button id="add-tag-button" class="icon-button" type="button" aria-label="Add category" title="Add category">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="settings-status" class="settings-status" role="status"></div>
      <div id="tag-list"></div>
    </section>
    <section id="detail-screen" hidden>
      <button id="back-button" class="back-button" type="button">← Back</button>
      <div id="detail-status" class="status" role="status"></div>
      <article id="detail" hidden>
        <p id="detail-date" class="detail-date"></p>
        <h1 id="detail-title"></h1>
        <div class="detail-tags-row">
          <div id="detail-tags" class="tags"></div>
          <button id="edit-detail-tags" class="secondary-button" type="button">Edit tags</button>
        </div>
        <div id="detail-text" class="detail-text"></div>
      </article>
    </section>
    <section id="tag-picker-screen" hidden>
      <form id="tag-picker-form">
        <div class="tag-picker-actions">
          <button id="tag-picker-apply" class="primary-button" type="submit" disabled>Apply</button>
          <button id="tag-picker-cancel" class="secondary-button" type="button">Cancel</button>
        </div>
        <h1>Edit tags</h1>
        <div id="tag-picker-status" class="settings-status" role="status"></div>
        <div id="tag-picker-list"></div>
      </form>
    </section>
  </main>
</body>
</html>
