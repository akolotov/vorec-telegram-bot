services:
  bot:
    image: ${VOREC_BOT_IMAGE:-ghcr.io/akolotov/vorec-telegram-bot:latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      INFERENCE_API_URL: ${INFERENCE_API_URL}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      tailscale-ingress:
        aliases:
          - ${WEBHOOK_DOCKER_ALIAS:?WEBHOOK_DOCKER_ALIAS must be set}

networks:
  tailscale-ingress:
    external: true
